<!DOCTYPE html>
<html>
<head>
    <title>HogoMart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f8;
        }

        .app {
            max-width: 430px;
            margin: auto;
            background: white;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 120px;
        }

        .logo {
            width: 100%;
            border-radius: 16px;
        }

        h1 {
            margin: 10px 0;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 12px;
            margin: 10px 0;
            box-shadow: 0 2px 8px #ddd;
        }

        .img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
        }

        .no-img {
            height: 140px;
            background: #eee;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .qty button {
            width: 40px;
            height: 40px;
            font-size: 18px;
            background: green;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px;
            box-shadow: 0 -3px 10px #ccc;
        }

        .checkout {
            width: 100%;
            padding: 14px;
            background: green;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
        }

        .tag {
            background: orange;
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<form action="/order" method="POST" onsubmit="prepareCart()">

<div class="app">

    <img src="/static/logo.png" class="logo">

    <h1>HogoMart 🚀</h1>

    <a href="/login">Admin</a> |
    <a href="/shop-login">Shop</a> |
    <a href="/delivery-login">Delivery</a>

    <h3>Your Details</h3>

    <input name="customer_name" id="name" placeholder="Name" required>
    <input name="phone" id="phone" placeholder="Phone" required>
    <textarea name="address" id="address" placeholder="Address" required></textarea>

    <input id="search" placeholder="Search products..." onkeyup="render()">

    <select id="category" onchange="render()">
        <option value="All">All Categories</option>
        <option>Grocery</option>
        <option>Pooja</option>
        <option>Bakery</option>
    </select>

    <div id="list"></div>

    <h3>Delivery</h3>
    <select name="distance" id="distance" onchange="calc()">
        <option value="within_2km">Within 2 km ₹20</option>
        <option value="2_5km">2-5 km ₹40</option>
    </select>

    <label>
        <input type="checkbox" name="emergency" onchange="calc()"> Emergency +₹20
    </label>

    <select name="payment_method">
        <option value="COD">Cash on Delivery</option>
        <option value="UPI">UPI</option>
    </select>

    <input type="hidden" name="cart_data" id="cartData">

</div>

<div class="bottom">
    <b>Total ₹<span id="total">0</span></b>
    <button class="checkout">Checkout</button>
</div>

</form>

<script>
const data = {{ products | tojson }};
let cart = [];

function render(){
    let s = document.getElementById("search").value.toLowerCase();
    let cat = document.getElementById("category").value;
    let html = "";

    Object.keys(data).forEach(shop=>{
        data[shop].forEach(p=>{
            if(!p.name.toLowerCase().includes(s)) return;
            if(cat!="All" && p.category!=cat) return;

            html += `
            <div class="card">
                ${p.image ? `<img src="/static/product_images/${p.image}" class="img">` : `<div class="no-img">No Image</div>`}

                <h3>${p.name}</h3>
                <b>₹${p.price}</b> • ${shop}<br>
                ${p.tag ? `<span class="tag">${p.tag}</span>`:""}
                <p>Stock: ${p.stock}</p>

                <input type="checkbox" class="chk"
                    data-shop="${shop}"
                    data-name="${p.name}"
                    data-price="${p.price}"
                    data-barcode="${p.barcode}"
                    data-stock="${p.stock}"
                    onchange="calc()">

                <div class="qty">
                    <button type="button" onclick="qty(this,-1)">-</button>
                    <input type="number" value="1" min="1">
                    <button type="button" onclick="qty(this,1)">+</button>
                </div>
            </div>
            `;
        });
    });

    document.getElementById("list").innerHTML = html;
    calc();
}

function qty(btn, val){
    let box = btn.parentElement;
    let input = box.querySelector("input");
    let v = parseInt(input.value)+val;
    if(v<1) v=1;
    input.value=v;
    calc();
}

function calc(){
    cart=[];
    let total=0;

    document.querySelectorAll(".card").forEach(card=>{
        let c = card.querySelector(".chk");
        let q = card.querySelector("input[type=number]");

        if(c.checked){
            let price=parseInt(c.dataset.price);
            let qty=parseInt(q.value);
            total+=price*qty;

            cart.push({
                shop:c.dataset.shop,
                name:c.dataset.name,
                price:price,
                qty:qty,
                barcode:c.dataset.barcode
            });
        }
    });

    let del = document.getElementById("distance").value=="within_2km"?20:40;
    let em = document.querySelector("input[name=emergency]").checked?20:0;

    document.getElementById("total").innerText = total+del+em;
}

function prepareCart(){
    document.getElementById("cartData").value = JSON.stringify(cart);

    localStorage.setItem("n",name.value);
    localStorage.setItem("p",phone.value);
    localStorage.setItem("a",address.value);
}

window.onload=()=>{
    name.value=localStorage.getItem("n")||"";
    phone.value=localStorage.getItem("p")||"";
    address.value=localStorage.getItem("a")||"";
    render();
}
</script>

</body>
</html>
