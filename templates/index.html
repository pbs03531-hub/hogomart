<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogoMart</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,system-ui}
    body{background:#f6f7fb;color:#111;padding-bottom:160px}

    .top{
      position:sticky;top:0;z-index:100;
      background:#fff;padding:12px;
      display:flex;justify-content:space-between;align-items:center;
      box-shadow:0 8px 20px rgba(0,0,0,.05)
    }

    .logo{display:flex;align-items:center;gap:8px}
    .logo img{width:40px;border-radius:10px}
    .logo h1{font-size:18px}

    .links a{
      font-size:11px;background:#111;color:#fff;
      padding:6px 8px;border-radius:20px;margin-left:5px;text-decoration:none
    }

    .hero{
      margin:12px;padding:20px;border-radius:20px;
      background:linear-gradient(135deg,#ff6b00,#ff2e63);
      color:#fff
    }

    .search{margin-top:10px;background:#fff;padding:10px;border-radius:12px}
    .search input{width:100%;border:none;outline:none}

    .section{padding:12px}
    .section h3{margin-bottom:8px}

    .grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px
    }

    .card{
      background:#fff;padding:10px;border-radius:15px;
      box-shadow:0 8px 20px rgba(0,0,0,.05)
    }

    .price{font-weight:bold}
    .btn{
      margin-top:5px;width:100%;padding:8px;border:none;
      border-radius:10px;background:#111;color:#fff
    }

    .cart{
      position:fixed;bottom:0;left:0;width:100%;
      background:#111;color:#fff;padding:10px
    }

    .cart button{
      width:100%;padding:10px;background:#ff6b00;
      border:none;color:#fff;border-radius:10px;margin-top:5px
    }
  </style>
</head>

<body>

<div class="top">
  <div class="logo">
    <img src="/static/logo.png">
    <h1>HogoMart</h1>
  </div>

  <div class="links">
    <a href="/login">User</a>
    <a href="/login?role=shop">Shop</a>
    <a href="/login?role=delivery">Delivery</a>
    <a href="/login?role=admin">Admin</a>
  </div>
</div>

<div class="hero">
  <h2>Order from local shops</h2>
  <p>Low platform charges</p>

  <div class="search">
    <input id="search" placeholder="Search products or shops">
  </div>
</div>

<div class="section">
  <h3>Featured Shops</h3>
  <div class="grid">
    {% for s in shops %}
      {% if s.featured %}
      <div class="card">
        <b>{{s.name}}</b>
        <p>{{s.category}}</p>
        <p>⭐ {{s.rating}}</p>
      </div>
      {% endif %}
    {% endfor %}
  </div>
</div>

<div class="section">
  <h3>Products</h3>
  <div class="grid" id="products"></div>
</div>

<div class="cart">
  <div id="cartText">0 items - ₹0</div>
  <button onclick="checkout()">Checkout</button>
</div>

<script>
const products = {{products|tojson}};
const shops = {{shops|tojson}};

let cart = {};

function render(){
  let container = document.getElementById("products");
  container.innerHTML="";

  let search = document.getElementById("search").value.toLowerCase();

  products.forEach(p=>{
    if(search && !p.name.toLowerCase().includes(search)) return;

    let card=document.createElement("div");
    card.className="card";

    let shop = shops.find(s=>s.id==p.shop_id);

    card.innerHTML=`
      <b>${p.name}</b>
      <p>${shop ? shop.name : ""}</p>
      <div class="price">₹${p.price}</div>
      <button class="btn" onclick="add('${p.id}')">Add</button>
    `;

    container.appendChild(card);
  });
}

function add(id){
  cart[id]=(cart[id]||0)+1;
  update();
}

function update(){
  let count=0,total=0;

  for(let id in cart){
    let p = products.find(x=>x.id==id);
    count+=cart[id];
    total+=p.price*cart[id];
  }

  document.getElementById("cartText").innerText = count+" items - ₹"+total;
}

function checkout(){
  let data=[];

  for(let id in cart){
    data.push({product_id:id,qty:cart[id]});
  }

  let form=document.createElement("form");
  form.method="POST";
  form.action="/order";

  let input=document.createElement("input");
  input.name="cart_data";
  input.value=JSON.stringify({items:data});

  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
}

document.getElementById("search").oninput=render;

render();
</script>

</body>
</html>
