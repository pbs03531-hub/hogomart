<!DOCTYPE html>
<html>
<head>
    <title>HogoMart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #111;
        }

        .app {
            max-width: 430px;
            margin: auto;
            min-height: 100vh;
            background: #ffffff;
            padding: 14px;
            padding-bottom: 135px;
        }

        .logo {
            width: 100%;
            border-radius: 22px;
            margin-bottom: 12px;
        }

        .top-card {
            background: linear-gradient(135deg, #0f8a3b, #18b65a);
            color: white;
            padding: 16px;
            border-radius: 22px;
            margin-bottom: 14px;
        }

        .top-card h1 {
            margin: 0;
            font-size: 26px;
        }

        .top-card p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.95;
        }

        .nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .nav a {
            background: #eef8f1;
            color: #0f7a36;
            text-align: center;
            padding: 10px 6px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px;
            margin: 7px 0;
            border-radius: 15px;
            border: 1px solid #ddd;
            font-size: 15px;
            background: #fff;
        }

        textarea {
            min-height: 75px;
        }

        .search-box {
            position: sticky;
            top: 0;
            background: white;
            padding: 8px 0;
            z-index: 5;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .shop-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
        }

        .shop-tab {
            white-space: nowrap;
            padding: 10px 14px;
            border-radius: 18px;
            background: #f0f0f0;
            border: none;
            font-weight: bold;
            color: #333;
        }

        .shop-tab.active {
            background: #0f8a3b;
            color: white;
        }

        .product {
            background: #ffffff;
            border-radius: 22px;
            padding: 12px;
            margin: 14px 0;
            box-shadow: 0 5px 18px rgba(0,0,0,0.09);
            border: 1px solid #eee;
        }

        .product-img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            border-radius: 18px;
            background: #eee;
        }

        .no-img {
            width: 100%;
            height: 145px;
            border-radius: 18px;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
            font-weight: bold;
        }

        .product-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
        }

        .price {
            font-size: 18px;
            color: #0f8a3b;
            font-weight: bold;
        }

        .meta {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }

        .tag {
            display: inline-block;
            background: #ff9800;
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-top: 6px;
        }

        .out {
            color: #d32f2f;
            font-weight: bold;
            margin-top: 8px;
        }

        .cart-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            gap: 10px;
        }

        .add-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .add-check input {
            width: 22px;
            height: 22px;
            margin: 0;
        }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-box button {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 12px;
            background: #0f8a3b;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .qty-box input {
            width: 58px;
            text-align: center;
            padding: 9px;
            margin: 0;
            font-weight: bold;
        }

        .delivery-card {
            background: #f8fff9;
            border: 1px solid #d9f0df;
            padding: 12px;
            border-radius: 18px;
            margin-top: 14px;
        }

        .bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -4px 18px rgba(0,0,0,0.15);
            padding: 12px;
            z-index: 10;
        }

        .bottom-inner {
            max-width: 430px;
            margin: auto;
        }

        .cart-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .checkout {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #0f8a3b, #18b65a);
            color: white;
            padding: 15px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 25px 10px;
        }
    </style>
</head>

<body>

<form action="/order" method="POST" onsubmit="prepareCart()">

<div class="app">

    <img src="/static/logo.png" class="logo">

    <div class="top-card">
        <h1>HogoMart 🚀</h1>
        <p>Order from multiple local shops in one delivery</p>
    </div>

    <div class="nav">
        <a href="/customer-login">Customer</a>
        <a href="/shop-login">Shop</a>
        <a href="/delivery-login">Delivery</a>
        <a href="/login">Admin</a>
    </div>

    <div class="section-title">Your Details</div>
    <input name="customer_name" id="name" placeholder="Your name" required>
    <input name="phone" id="phone" placeholder="Phone number" required>
    <textarea name="address" id="address" placeholder="Delivery address" required></textarea>

    <div class="search-box">
        <div class="section-title">Search Products</div>
        <input id="search" placeholder="Search milk, rice, camphor..." onkeyup="renderProducts()">

        <div class="filters">
            <select id="category" onchange="renderProducts()">
                <option value="All">All Categories</option>
            </select>

            <select id="sortBy" onchange="renderProducts()">
                <option value="az">A-Z</option>
                <option value="low">Low Price</option>
                <option value="high">High Price</option>
            </select>
        </div>

        <div class="shop-tabs" id="shopTabs"></div>
    </div>

    <div id="productList"></div>

    <div class="delivery-card">
        <div class="section-title">Delivery</div>

        <select name="distance" id="distance" onchange="calculateTotal()">
            <option value="within_2km">Within 2 km - ₹20</option>
            <option value="2_5km">2 to 5 km - ₹40</option>
        </select>

        <label>
            <input type="checkbox" name="emergency" value="yes" onchange="calculateTotal()">
            Emergency delivery + ₹20
        </label>

        <textarea name="special_request" placeholder="Special request / delivery note"></textarea>

        <select name="payment_method">
            <option value="COD">Cash on Delivery</option>
            <option value="UPI">UPI Payment</option>
        </select>
    </div>

    <input type="hidden" name="cart_data" id="cartData">

</div>

<div class="bottom">
    <div class="bottom-inner">
        <div class="cart-info">
            <span><span id="itemCount">0</span> item(s)</span>
            <span>Total ₹<span id="total">0</span></span>
        </div>
        <button class="checkout" type="submit">Checkout</button>
    </div>
</div>

</form>

<script>
const products = {{ products | tojson }};
let selectedShop = "All";
let cart = [];

function getCategories() {
    let cats = ["All"];
    Object.keys(products).forEach(shop => {
        products[shop].forEach(p => {
            let c = p.category || "General";
            if (!cats.includes(c)) cats.push(c);
        });
    });

    const category = document.getElementById("category");
    category.innerHTML = "";
    cats.forEach(c => {
        category.innerHTML += `<option value="${c}">${c}</option>`;
    });
}

function renderShopTabs() {
    const tabs = document.getElementById("shopTabs");
    tabs.innerHTML = "";

    let shops = ["All", ...Object.keys(products)];

    shops.forEach(shop => {
        tabs.innerHTML += `
            <button type="button"
                class="shop-tab ${shop === selectedShop ? 'active' : ''}"
                onclick="selectShop('${shop}')">
                ${shop}
            </button>
        `;
    });
}

function selectShop(shop) {
    selectedShop = shop;
    renderShopTabs();
    renderProducts();
}

function productImage(img) {
    if (img && img.trim() !== "") {
        return `<img src="/static/product_images/${img}" class="product-img">`;
    }
    return `<div class="no-img">No Image</div>`;
}

function renderProducts() {
    const search = document.getElementById("search").value.toLowerCase();
    const category = document.getElementById("category").value;
    const sortBy = document.getElementById("sortBy").value;
    const list = document.getElementById("productList");

    let all = [];

    Object.keys(products).forEach(shop => {
        if (selectedShop !== "All" && selectedShop !== shop) return;

        products[shop].forEach(p => {
            if (!p.name.toLowerCase().includes(search)) return;
            if (category !== "All" && (p.category || "General") !== category) return;

            all.push({...p, shop: shop});
        });
    });

    if (sortBy === "az") {
        all.sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === "low") {
        all.sort((a, b) => Number(a.price) - Number(b.price));
    } else if (sortBy === "high") {
        all.sort((a, b) => Number(b.price) - Number(a.price));
    }

    list.innerHTML = "";

    if (all.length === 0) {
        list.innerHTML = `<div class="empty">No products found</div>`;
        calculateTotal();
        return;
    }

    all.forEach((p, index) => {
        const out = Number(p.stock) <= 0;
        const productId = `${p.shop}_${p.barcode}_${index}`.replaceAll(" ", "_");

        list.innerHTML += `
            <div class="product">
                ${productImage(p.image || "")}

                <div class="product-head">
                    <div>
                        <div class="product-name">${p.name}</div>
                        <div class="meta">${p.shop}</div>
                    </div>
                    <div class="price">₹${p.price}</div>
                </div>

                <div class="meta">${p.category || "General"} • Stock: ${p.stock}</div>
                ${p.tag ? `<span class="tag">${p.tag}</span>` : ""}
                ${out ? `<div class="out">Out of Stock</div>` : ""}

                <div class="cart-row">
                    <label class="add-check">
                        <input type="checkbox" class="check"
                            data-shop="${p.shop}"
                            data-name="${p.name}"
                            data-price="${p.price}"
                            data-barcode="${p.barcode}"
                            data-stock="${p.stock}"
                            onchange="calculateTotal()" ${out ? "disabled" : ""}>
                        Add
                    </label>

                    <div class="qty-box">
                        <button type="button" onclick="changeQty(this, -1)" ${out ? "disabled" : ""}>-</button>
                        <input type="number" class="qty" value="1" min="1" max="${p.stock}" onchange="calculateTotal()" ${out ? "disabled" : ""}>
                        <button type="button" onclick="changeQty(this, 1)" ${out ? "disabled" : ""}>+</button>
                    </div>
                </div>
            </div>
        `;
    });

    calculateTotal();
}

function changeQty(button, change) {
    const productBox = button.closest(".product");
    const qtyInput = productBox.querySelector("input[type='number']");
    const check = productBox.querySelector(".check");

    let qty = parseInt(qtyInput.value || "1") + change;
    const stock = parseInt(check.dataset.stock || "1");

    if (qty < 1) qty = 1;
    if (qty > stock) qty = stock;

    qtyInput.value = qty;
    check.checked = true;
    calculateTotal();
}

function calculateTotal() {
    cart = [];
    let subtotal = 0;
    let itemCount = 0;

    document.querySelectorAll(".product").forEach(productBox => {
        const check = productBox.querySelector(".check");
        const qtyInput = productBox.querySelector("input[type='number']");

        if (check && check.checked) {
            const qty = parseInt(qtyInput.value || "1");
            const price = parseInt(check.dataset.price || "0");

            subtotal += price * qty;
            itemCount += qty;

            cart.push({
                shop: check.dataset.shop,
                name: check.dataset.name,
                price: price,
                qty: qty,
                barcode: check.dataset.barcode
            });
        }
    });

    const distance = document.getElementById("distance").value;
    const delivery = distance === "within_2km" ? 20 : 40;
    const emergencyBox = document.querySelector("input[name='emergency']");
    const emergency = emergencyBox && emergencyBox.checked ? 20 : 0;

    const total = subtotal + delivery + emergency;

    document.getElementById("total").innerText = total;
    document.getElementById("itemCount").innerText = itemCount;
}

function prepareCart() {
    document.getElementById("cartData").value = JSON.stringify(cart);

    localStorage.setItem("hm_name", document.getElementById("name").value);
    localStorage.setItem("hm_phone", document.getElementById("phone").value);
    localStorage.setItem("hm_address", document.getElementById("address").value);
}

window.onload = function () {
    document.getElementById("name").value = localStorage.getItem("hm_name") || "";
    document.getElementById("phone").value = localStorage.getItem("hm_phone") || "";
    document.getElementById("address").value = localStorage.getItem("hm_address") || "";

    getCategories();
    renderShopTabs();
    renderProducts();
};
</script>

</body>
</html>
