<!DOCTYPE html>
<html>
<head>
    <title>HogoMart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; background:#f4f6f8; margin:0; }
        .app { max-width:430px; margin:auto; background:white; min-height:100vh; padding:15px; padding-bottom:120px; box-sizing:border-box; }
        .logo { width:100%; border-radius:18px; margin-bottom:14px; }

        input, textarea, select {
            width:100%; padding:14px; margin:8px 0;
            border-radius:12px; border:1px solid #ccc; font-size:16px;
        }

        .card {
            background:#fff; border:1px solid #ddd;
            border-radius:16px; padding:14px; margin:12px 0;
            box-shadow:0 2px 8px #ddd;
        }

        .img {
            width:100%; height:140px;
            object-fit:cover; border-radius:14px;
        }

        .no-img {
            height:140px; background:#eee;
            border-radius:14px;
            display:flex; align-items:center; justify-content:center;
            color:#777; font-weight:bold;
        }

        .btn, button {
            width:100%; background:green; color:white;
            border:0; padding:14px;
            border-radius:12px; font-size:17px;
            font-weight:bold; margin:8px 0;
        }

        .qtyrow { display:flex; gap:10px; align-items:center; }
        .qtyrow button { width:40px; }

        .bottom {
            position:fixed; bottom:0; left:0; right:0;
            background:white; padding:12px;
            box-shadow:0 -3px 12px #ccc;
        }

        .bottom-inner { max-width:430px; margin:auto; }

        .out { color:red; font-weight:bold; }
    </style>
</head>

<body>

<form action="/order" method="POST" onsubmit="prepareCart()">

<div class="app">

    <img src="/static/logo.png" class="logo">

    <h1>HogoMart 🚀</h1>
    <p><b>Order from multiple shops in one delivery</b></p>

    <a href="/customer-login">Customer Login</a> |
    <a href="/login">Admin</a> |
    <a href="/delivery-login">Delivery</a>

    <h3>Your Details</h3>
    <input name="customer_name" id="name" placeholder="Name" required>
    <input name="phone" id="phone" placeholder="Phone" required>
    <textarea name="address" id="address" placeholder="Address" required></textarea>

    <input id="globalSearch" placeholder="Search products..." onkeyup="showProducts()">

    <select id="shopFilter" onchange="showProducts()">
        <option value="All">All Shops</option>
        {% for shop in shops.keys() %}
            <option value="{{ shop }}">{{ shop }}</option>
        {% endfor %}
    </select>

    <div id="productList"></div>

    <h3>Delivery</h3>
    <select name="distance" id="distance" onchange="calculateTotal()">
        <option value="within_2km">Within 2 km - ₹20</option>
        <option value="2_5km">2 to 5 km - ₹40</option>
    </select>

    <label>
        <input type="checkbox" name="emergency" value="yes" onchange="calculateTotal()">
        Emergency + ₹20
    </label>

    <textarea name="special_request" placeholder="Special request"></textarea>

    <select name="payment_method">
        <option value="COD">Cash on Delivery</option>
        <option value="UPI">UPI Payment</option>
    </select>

    <input type="hidden" name="cart_data" id="cartData">

</div>

<div class="bottom">
    <div class="bottom-inner">
        <b>Total: ₹<span id="total">0</span></b>
        <button>Checkout</button>
    </div>
</div>

</form>

<script>
const products = {{ products | tojson }};
let cart = [];

function showProducts() {
    const search = document.getElementById("globalSearch").value.toLowerCase();
    const shopFilter = document.getElementById("shopFilter").value;
    const list = document.getElementById("productList");
    list.innerHTML = "";

    Object.keys(products).forEach(shop => {

        if (shopFilter !== "All" && shop !== shopFilter) return;

        products[shop].forEach(item => {

            if (!item.name.toLowerCase().includes(search)) return;

            const out = item.stock <= 0;

            let imgHtml = item.image
                ? `<img class="img" src="/static/product_images/${item.image}">`
                : `<div class="no-img">No Image</div>`;

            list.innerHTML += `
            <div class="card">
                ${imgHtml}
                <h3>${item.name}</h3>
                <p><b>₹${item.price}</b> • ${shop}</p>
                <p>Stock: ${item.stock}</p>

                ${out ? "<p class='out'>Out of Stock</p>" : ""}

                <input type="checkbox" class="check"
                    data-shop="${shop}"
                    data-name="${item.name}"
                    data-price="${item.price}"
                    data-barcode="${item.barcode}"
                    data-stock="${item.stock}"
                    onchange="calculateTotal()" ${out ? "disabled" : ""}>

                <div class="qtyrow">
                    <button type="button" onclick="changeQty(this,-1)">-</button>
                    <input class="qty" type="number" value="1" min="1" max="${item.stock}">
                    <button type="button" onclick="changeQty(this,1)">+</button>
                </div>
            </div>`;
        });
    });

    calculateTotal();
}

function changeQty(btn, val) {
    let box = btn.closest(".card");
    let qty = box.querySelector(".qty");
    let check = box.querySelector(".check");

    let v = parseInt(qty.value) + val;
    if (v < 1) v = 1;
    if (v > parseInt(check.dataset.stock)) v = check.dataset.stock;

    qty.value = v;
    check.checked = true;

    calculateTotal();
}

function calculateTotal() {
    let total = 0;
    cart = [];

    document.querySelectorAll(".card").forEach(box => {

        let check = box.querySelector(".check");
        let qty = parseInt(box.querySelector(".qty").value);

        if (check.checked) {
            let price = parseInt(check.dataset.price);

            total += price * qty;

            cart.push({
                shop: check.dataset.shop,
                name: check.dataset.name,
                price: price,
                qty: qty,
                barcode: check.dataset.barcode
            });
        }
    });

    let delivery = document.getElementById("distance").value === "within_2km" ? 20 : 40;
    let emergency = document.querySelector("input[name='emergency']").checked ? 20 : 0;

    document.getElementById("total").innerText = total + delivery + emergency;
}

function prepareCart() {
    localStorage.setItem("name", document.getElementById("name").value);
    localStorage.setItem("phone", document.getElementById("phone").value);
    localStorage.setItem("address", document.getElementById("address").value);

    document.getElementById("cartData").value = JSON.stringify(cart);
}

window.onload = function() {
    document.getElementById("name").value = localStorage.getItem("name") || "";
    document.getElementById("phone").value = localStorage.getItem("phone") || "";
    document.getElementById("address").value = localStorage.getItem("address") || "";

    showProducts();
};
</script>

</body>
</html>
